# =============================================================================
# Uchaly Keycloak Theme
# =============================================================================
# Наследуем базовую тему Keycloak — для страниц, которые мы НЕ переопределили
# (webauthn-*, login-x509-info.ftl и т.п.), будет использоваться родительская
# разметка. Все основные страницы входа/регистрации/сброса/2FA — наши.
parent=keycloak
import=common/keycloak

styles=css/uchaly.css
locales=ru,en

# Тёмная тема управляется классом .dark на <html>, который ставит
# template.ftl по cookie 'uchaly_theme'. Флаг darkMode=true здесь
# не нужен — он включает собственный переключатель родительской темы,
# который мы не используем.