# docker-compose.yml
# =============================================================================
# Uchaly Keycloak — замена кастомного Uchaly.Identity на Keycloak 26.0
# =============================================================================
# Данный compose-файл поднимает:
#   - PostgreSQL для Keycloak
#   - Keycloak 26.0 (в режиме start-dev для разработки)
#   - (опционально) API Gateway, который валидирует токены Keycloak
#
# Все секреты берутся из .env (см. .env.example)
# =============================================================================

networks:
  uchaly_network:
    driver: bridge

volumes:
  keycloak_db_data:

services:
  # ---------------------------------------------------------------------------
  # База данных для Keycloak
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:17-alpine
    container_name: uchaly-keycloak-db
    restart: unless-stopped
    networks:
      - uchaly_network
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data/pgdata
    ports:
      # Наружу БД не нужна, но порт оставим для отладки
      - "${KEYCLOAK_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Keycloak 26.0
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: uchaly-keycloak
    restart: unless-stopped
    networks:
      - uchaly_network
    depends_on:
      keycloak-db:
        condition: service_healthy
    # start-dev отключает кеширование и HTTPS-требования — удобно для разработки.
    # Для продакшена используйте `start` + `--hostname`, `--proxy-headers` и т.д.
    command:
      - start-dev
      - --http-port=8080
      - --http-enabled=true
      - --hostname-strict=false
      - --import-realm
    environment:
      # Администратор Keycloak (для входа в админ-консоль)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Подключение к БД
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Логирование
      KC_LOG_LEVEL: info
      # Health endpoint (используется gateway healthcheck)
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Доверяем всем прокси (для разработки)
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${KEYCLOAK_HTTP_PORT}:8080"
    volumes:
      # Автоматический импорт realm при старте
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # # ---------------------------------------------------------------------------
  # # API Gateway (Uchaly.APIgateway) — обновляется, чтобы валидировать JWT Keycloak
  # # ---------------------------------------------------------------------------
  # # ВАЖНО: сервис Identity больше НЕ поднимается. Образ нужно собрать заново
  # # из обновлённого Uchaly.APIgateway (см. ниже раздел «Изменения в Gateway»).
  # uchaly-apigateway:
  #   image: ${DOCKER_REGISTRY-}uchaly-apigateway
  #   build:
  #     context: .
  #     dockerfile: Uchaly/Uchaly.APIgateway/Uchaly.APIgateway/Dockerfile
  #   container_name: uchaly-apigateway
  #   restart: unless-stopped
  #   networks:
  #     - uchaly_network
  #   depends_on:
  #     keycloak:
  #       condition: service_healthy
  #   ports:
  #     - "${GATEWAY_HTTP_PORT}:8080"
  #     - "${GATEWAY_HTTPS_PORT}:8081"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_HTTP_PORTS=8080
  #     # URL Keycloak (используется gateway для валидации токенов)
  #     - Keycloak__Authority=http://keycloak:8080/realms/${KEYCLOAK_REALM}
  #     - Keycloak__MetadataAddress=http://keycloak:8080/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration
  #     - Keycloak__Audience=${KEYCLOAK_AUDIENCE}